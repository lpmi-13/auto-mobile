name: "CodeQL"

# CodeQL was the single largest pull-request job (~14 min median, ~12% of PR
# Linux minutes) and is not a required check, so it runs on push to main and
# weekly instead of on every PR (#10888). Code scanning still records alerts
# against main; PR-time alerts are intentionally given up.
on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    # Mondays 06:00 UTC, clear of the nightly run at 00:00.
    - cron: "0 6 * * 1"

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  codeql-node:
    name: "CodeQL Analysis - Node.js/TypeScript"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        language: ["typescript"]
    steps:
      - name: "Git Checkout"
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          lfs: false

      - name: "Initialize CodeQL"
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          queries: security-extended,security-and-quality

      - uses: ./.github/actions/setup-auto-mobile-npm-package

      - name: "Build TypeScript"
        env:
          TURBO_TELEMETRY_DISABLED: "1"
          TURBO_NO_UPDATE_NOTIFIER: "1"
          DO_NOT_TRACK: "1"
          NO_COLOR: "1"
        run: turbo run build --output-logs=errors-only

      - name: "Perform CodeQL Analysis"
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: "/language:${{matrix.language}}"
