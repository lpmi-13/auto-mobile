name: "Build CtrlProxy iOS IPA"

on:
  workflow_call:
    inputs:
      checkout-ref:
        description: "Commit or tag to build; defaults to the caller SHA"
        required: false
        type: string
        default: ""
      upload-artifact:
        description: "Whether to upload the built IPA as a workflow artifact"
        required: false
        type: boolean
        default: true
      artifact-retention-days:
        description: "How long to retain the uploaded IPA artifact"
        required: false
        type: number
        default: 7
    outputs:
      sha256:
        description: "SHA256 checksum of the built IPA"
        value: ${{ jobs.build.outputs.sha256 }}
      runner_sha256:
        description: "SHA256 checksum of the CtrlProxyUITests xctest executable"
        value: ${{ jobs.build.outputs.runner_sha256 }}

jobs:
  build:
    name: "Build CtrlProxy iOS IPA"
    runs-on: macos-26
    timeout-minutes: 30
    outputs:
      sha256: ${{ steps.checksum.outputs.ipa_sha256 }}
      runner_sha256: ${{ steps.checksum.outputs.runner_sha256 }}
    steps:
      - name: "Checkout code"
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          lfs: false
          ref: ${{ inputs.checkout-ref || github.sha }}
          persist-credentials: false

      - name: "Select Xcode 26.5"
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: "26.5"

      # Both installs are network I/O and independent of the simulator-runtime
      # ensure below, so background them and let it overlap. The single barrier
      # before the build is load-bearing rather than cosmetic:
      # ctrl-proxy-create-ipa.sh re-invokes install-xcodegen.sh and pipes to
      # xcpretty, and install-xcodegen.sh documents the concurrent-prefix race
      # two installs cause against one prefix ("File exists", nested
      # share/xcodegen/xcodegen/). Mechanism per #3779.
      - name: "Install XcodeGen"
        run: ./scripts/ios/install-xcodegen.sh
        background: true
        id: install-xcodegen

      - name: "Cache Ruby gems"
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.gem
          key: gems-xcpretty-${{ runner.os }}

      # Must stay AFTER the cache restore -- `gem install` writes ~/.gem, which
      # is exactly what that step restores. Backgrounding it is fine; hoisting
      # it above the cache is not.
      - name: "Install xcpretty"
        run: gem install xcpretty
        background: true
        id: install-xcpretty

      # Foreground, and now overlapped by both installs. Stays after
      # `Select Xcode 26.5` because it resolves against the selected toolchain.
      - name: "Ensure iOS Simulator runtime"
        uses: ./.github/actions/ensure-ios-simulator-runtime

      - wait: [install-xcodegen, install-xcpretty]

      - name: "Build CtrlProxy iOS IPA"
        id: checksum
        run: ./scripts/ios/ctrl-proxy-create-ipa.sh --output /tmp/control-proxy.ipa

      - name: "Upload CtrlProxy iOS IPA"
        if: ${{ inputs.upload-artifact }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ctrl-proxy-ios-ipa
          path: /tmp/control-proxy.ipa
          retention-days: ${{ inputs.artifact-retention-days }}
